<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrollment Form | Ivy Ocap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">SE</div>
    <div>
      <h1>Student Enrollment</h1>
      <p>Student Information System</p>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <p class="eyebrow">BSIS 2A • IS104 ACTIVITY 1</p>
      <h2>Enrollment Form</h2>
      <p class="description">Please complete the form below with the student's information.</p>
    </section>

    <section class="card">
      <div class="card-heading">
        <div>
          <h3>Student Information</h3>
          <p>Fields marked with <span class="required">*</span> are required.</p>
        </div>
        <span class="step">STEP 01</span>
      </div>

      <form id="enrollmentForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="studentId">Student ID <span class="required">*</span></label>
            <input id="studentId" name="studentId" type="text" placeholder="e.g. 2026-0001" required>
          </div>

          <div class="form-group">
            <label for="fullName">Full Name <span class="required">*</span></label>
            <input id="fullName" name="fullName" type="text" placeholder="Enter full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input id="email" name="email" type="email" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="age">Age <span class="required">*</span></label>
            <input id="age" name="age" type="number" min="1" max="100" placeholder="Enter age" required>
          </div>

          <div class="form-group">
            <label for="course">Course <span class="required">*</span></label>
            <select id="course" name="course" required>
              <option value="">Select course</option>
              <option>BS Information Systems</option>
              <option>BS Information Technology</option>
              <option>BS Computer Science</option>
              <option>BS Computer Engineering</option>
            </select>
          </div>

          <div class="form-group">
            <label for="yearLevel">Year Level <span class="required">*</span></label>
            <select id="yearLevel" name="yearLevel" required>
              <option value="">Select year level</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="submit-btn" type="submit">Submit Enrollment</button>
          <button class="clear-btn" type="reset">Clear Form</button>
        </div>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>
    </section>

    <footer>
      <p>Designed and prepared by <strong>IVY OCAP</strong></p>
      <p>IS104 • BSIS 2A</p>
    </footer>
  </main>

  <script>
    const form = document.getElementById("enrollmentForm");
    const message = document.getElementById("formMessage");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      message.textContent = "Enrollment form submitted successfully!";
      message.classList.add("success");
    });

    form.addEventListener("reset", function () {
      message.textContent = "";
      message.classList.remove("success");
    });
  </script>
</body>
</html>
